[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-contrib-scout"
version = "0.1.0"
description = "Find open source issues worth contributing to, ranked by how likely they are to be a good first experience"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alfredo Lorentiar Santonanda" }]
keywords = ["github", "open-source", "contributing", "good-first-issue", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
gh-contrib-scout = "gh_contrib_scout.cli:main"

[project.urls]
Homepage = "https://github.com/alorentiar/gh-contrib-scout"
Issues = "https://github.com/alorentiar/gh-contrib-scout/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_contrib_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
